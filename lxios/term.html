<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101014; overflow: hidden; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #term { flex: 1; min-height: 0; padding: 2px 4px 0 4px; }
  #keys { display: flex; gap: 4px; padding: 5px 4px calc(5px + env(safe-area-inset-bottom)) 4px; background: #1c1c22;
          overflow-x: auto; -webkit-overflow-scrolling: touch; flex: none; }
  #keys button { flex: none; min-width: 42px; height: 34px; border: 0; border-radius: 6px; background: #34343c;
                 color: #eee; font: 15px -apple-system, sans-serif; padding: 0 9px; }
  #keys button.on { background: #0a84ff; }
  #keys button:active { background: #55555f; }
</style>
</head>
<body>
<div id="term"></div>
<div id="keys">
  <button data-k="esc">Esc</button>
  <button data-k="ctrl" id="ctrl">Ctrl</button>
  <button data-k="tab">Tab</button>
  <button data-k="up">&#8593;</button>
  <button data-k="down">&#8595;</button>
  <button data-k="left">&#8592;</button>
  <button data-k="right">&#8594;</button>
  <button data-s="|">|</button>
  <button data-s="-">-</button>
  <button data-s="/">/</button>
  <button data-s="~">~</button>
  <button data-k="c-c">^C</button>
  <button data-k="c-d">^D</button>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const post = (m) => window.webkit.messageHandlers.lx.postMessage(m);
  const term = new Terminal({ fontSize: 13, fontFamily: 'Menlo, monospace', cursorBlink: true, scrollback: 5000,
                              theme: { background: '#101014' }, allowProposedApi: true });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  let ctrl = false;
  const ctrlBtn = document.getElementById('ctrl');
  function send(s) {
    if (ctrl && s.length === 1) {
      const c = s.toLowerCase().charCodeAt(0);
      if (c >= 97 && c <= 122) s = String.fromCharCode(c - 96);
      else if (s === '[') s = '\x1b'; else if (s === ' ') s = '\x00';
      ctrl = false; ctrlBtn.classList.remove('on');
    }
    post({ t: 'in', d: s });
  }
  term.onData(send);
  const seq = { esc: '\x1b', tab: '\t', up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D', 'c-c': '\x03', 'c-d': '\x04' };
  document.querySelectorAll('#keys button').forEach(b => {
    b.addEventListener('touchstart', e => e.preventDefault(), { passive: false });   // keep the keyboard up
    b.addEventListener('touchend', e => { e.preventDefault(); press(b); });
    b.addEventListener('click', () => press(b));
  });
  function press(b) {
    const k = b.dataset.k;
    if (k === 'ctrl') { ctrl = !ctrl; ctrlBtn.classList.toggle('on', ctrl); }
    else if (k) post({ t: 'in', d: seq[k] });
    else send(b.dataset.s);
    term.focus();
  }
  // output from the guest: base64 of raw bytes
  window.lxWrite = (b64) => {
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    term.write(u);
  };
  function resize() {
    try { fit.fit(); } catch (e) {}
    post({ t: 'size', c: term.cols, r: term.rows });
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => {
    document.body.style.height = window.visualViewport.height + 'px'; resize();
  });
  resize();
  term.focus();
  post({ t: 'ready', c: term.cols, r: term.rows });
</script>
</body>
</html>
