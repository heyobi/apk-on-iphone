name: LxWeb
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
targets:
  LxWeb:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.lxweb
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
