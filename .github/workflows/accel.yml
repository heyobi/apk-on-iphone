# Accelerator prototype (tests/accel): how much faster guest code runs when translated
# to WebAssembly and compiled by a JavaScript engine's JIT, vs the interpreter.
name: Accelerator prototype

on:
  push:
    branches: [ linux-userland ]
    paths: [ "tests/accel/**", ".github/workflows/accel.yml", "tools/lxrun.c" ]
  workflow_dispatch:

concurrency:
  group: accel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc gcc wabt nodejs > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Measure
        run: sh tests/accel/run.sh "$RUNNER_TEMP/accel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accel
          path: |
            ${{ runner.temp }}/accel/bench.wasm
            ${{ runner.temp }}/accel/bench.json
            ${{ runner.temp }}/accel/bench.mem
            ${{ runner.temp }}/accel/run.js
            ${{ runner.temp }}/accel/mnemonics.txt
            ${{ runner.temp }}/accel/root/bench
          retention-days: 5

  jsc:
    needs: linux
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: accel
          path: accel
      - name: wasm, JavaScriptCore (WebKit's engine)
        run: |
          J=/System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Helpers/jsc
          [ -x "$J" ] || J=$(find /System/Library/Frameworks/JavaScriptCore.framework -name jsc -type f | head -n 1)
          echo "jsc: $J"; sw_vers; sysctl -n machdep.cpu.brand_string
          echo "== jsc default tiering"; "$J" accel/run.js -- accel
          echo "== jsc optimizing tier only"; "$J" --useWasmLLInt=false --useBBQJIT=false accel/run.js -- accel || true
      - name: interpreter on the same Mac (lxrun, Darwin host as on iOS)
        continue-on-error: true
        run: |
          make build/lxrun
          mkdir -p r && cp accel/root/bench r/bench && chmod +x r/bench
          s=$(date +%s); ./build/lxrun r /bench; echo "time: $(( $(date +%s) - s )) s (whole seconds)"
          /usr/bin/time -p ./build/lxrun r /bench

  bridge:
    needs: linux
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: accel
          path: accel
      - name: Build the bridge benchmark app for the simulator
        run: |
          set -o pipefail
          cp accel/bench.wasm accel/bench.json accel/bench.mem tests/accel/bridge/Resources/
          brew install xcodegen
          cd tests/accel/bridge && xcodegen generate
          xcodebuild build -project BridgeBench.xcodeproj -scheme BridgeBench -configuration Release -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1             || { grep -E "error:" build.log | head -n 40; tail -n 30 build.log; exit 1; }
      - name: Run it in WKWebView (simulator)
        run: |
          cd tests/accel/bridge
          UDID=$(bash sim-device.sh "iPhone 17 Pro")
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=$(find build/dd -name BridgeBench.app -path '*iphonesimulator*' | head -n 1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.heyobi.bridgebench
          D=$(xcrun simctl get_app_container "$UDID" com.heyobi.bridgebench data)
          for i in $(seq 1 300); do [ -f "$D/Documents/result.json" ] && break; sleep 2; done
          sysctl -n machdep.cpu.brand_string
          python3 -m json.tool "$D/Documents/result.json" || cat "$D/Documents/result.json" || echo "no result"
          xcrun simctl io "$UDID" screenshot shot.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bridge, path: tests/accel/bridge/shot.png, retention-days: 5 }

  workloads:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Debian arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-debian.sh "$RUNNER_TEMP/debian"
      - name: Syscalls of real workloads
        run: sh tests/accel/workloads.sh "$RUNNER_TEMP/debian"
