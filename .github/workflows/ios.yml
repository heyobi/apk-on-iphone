# Builds an unsigned .ipa of the iOS test app (ios/). Sideload it with
# SideStore / AltStore / Sideloadly, which sign it with your own Apple ID.
# A push to main also publishes it as a GitHub Release (v<app version>.<run number>).
name: iOS IPA

on:
  push:
    paths: [ "core/**", "gpu/**", "ios/**", "java/**", "guest/**", "tools/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Android's own linker64, bionic, toybox and mksh for the "Android" button, and the
      # framework an app's process needs for the "Uygulama" button (ios/android-files.txt),
      # from the AOSP 14 GSI pinned in tools/fetch-android.sh.
      - name: Cache Android root
        id: aroot
        uses: actions/cache@v4
        with:
          path: aroot-mini
          key: aroot-${{ hashFiles('tools/fetch-android.sh', 'tools/android-root.sh', 'tools/mini-root.sh', 'tools/android-setup.sh', 'tools/mkprops.py', 'tools/uncompress-art.py', 'tools/cacerts-extra.pem', 'tools/zipdrop.py', 'ios/android-files.txt') }}

      - name: Fetch Android root
        if: steps.aroot.outputs.cache-hit != 'true'
        run: |
          brew install e2fsprogs xz
          export PATH="$(brew --prefix e2fsprogs)/sbin:$PATH"
          sh tools/fetch-android.sh "$RUNNER_TEMP/aroot"
          # what init/apexd do at boot, with Android's own tools run by our interpreter on the runner
          make build/aoiproc
          sh tools/android-setup.sh "$RUNNER_TEMP/aroot" > /dev/null
          sh tools/mini-root.sh "$RUNNER_TEMP/aroot" "$PWD/aroot-mini" ios/android-files.txt
          du -sh aroot-mini
          rm -rf "$RUNNER_TEMP/aroot"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Outside the cached step: a restored root must get the current test dex files,
      # our framework services (aoi.dex, java/src) and the gralloc mapper (guest/mapper.c).
      - name: Guest files we build
        run: |
          set -eu
          mkdir -p aroot-mini/data/local/tmp aroot-mini/vendor/lib64/hw
          python3 tests/mkdex.py aroot-mini/data/local/tmp/hello.dex
          python3 tests/mkdex.py aroot-mini/data/local/tmp/gc.dex 0 20000
          sh tools/javadex.sh "$PWD/aroot-mini/data/local/tmp/aoi.dex"
          brew install lld
          make build/mapper.aoi.so GUEST_LD="--ld-path=$(brew --prefix lld)/bin/ld.lld"
          cp build/mapper.aoi.so aroot-mini/vendor/lib64/hw/mapper.aoi.so
          # the guest's OpenGL ES driver: Android's libEGL loads it for ro.hardware.egl=aoi
          make build/libGLES_aoi.so GUEST_LD="--ld-path=$(brew --prefix lld)/bin/ld.lld"
          mkdir -p aroot-mini/vendor/lib64/egl
          cp build/libGLES_aoi.so aroot-mini/vendor/lib64/egl/libGLES_aoi.so

      # OpenGL ES on the phone's GPU: ANGLE (BSD-3) on Metal, as static libraries built by
      # Godot's godot-angle-static (MIT), and the Khronos EGL/GLES headers (gpu/host.c).
      - name: Cache ANGLE
        id: angle
        uses: actions/cache@v4
        with:
          path: angle-ios
          key: angle-ios-chromium-7578-khr-db3425b-1cdd228

      - name: Fetch ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p angle-ios/lib angle-ios/include/EGL angle-ios/include/GLES3 angle-ios/include/KHR angle-ios/licenses
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/angle.zip" \
            "https://github.com/godotengine/godot-angle-static/releases/download/chromium%2F7578/godot-angle-static-arm64-ios-release.zip"
          unzip -o -q "$RUNNER_TEMP/angle.zip" -d "$RUNNER_TEMP/angle"
          for l in ANGLE EGL GLES; do cp "$(find "$RUNNER_TEMP/angle" -name "lib$l.ios.arm64.a" | head -1)" "angle-ios/lib/lib$l.a"; done
          ls -la angle-ios/lib
          EGL=https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/db3425b8246136faccb5e2782b5694960bd6edf1/api
          GLR=https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/1cdd228e34966dd6b95bd203e9f84faba0f371a1/api
          for h in EGL/egl.h EGL/eglext.h EGL/eglplatform.h KHR/khrplatform.h; do curl -fsSL --retry 3 -o "angle-ios/include/$h" "$EGL/$h"; done
          for h in GLES3/gl3.h GLES3/gl32.h GLES3/gl3platform.h; do curl -fsSL --retry 3 -o "angle-ios/include/$h" "$GLR/$h"; done
          curl -fsSL --retry 3 "https://chromium.googlesource.com/angle/angle/+/refs/heads/chromium/7578/LICENSE?format=TEXT" \
            | base64 -d > angle-ios/licenses/ANGLE.txt
          curl -fsSL --retry 3 -o angle-ios/licenses/godot-angle-static.txt \
            https://raw.githubusercontent.com/godotengine/godot-angle-static/chromium/7578/LICENSE.md
          head -3 angle-ios/licenses/ANGLE.txt

      - name: Build app binary
        run: |
          set -eu
          APP=build/Payload/ApkOnIphone.app
          mkdir -p "$APP"
          # the newest Xcode on the runner: Liquid Glass (UIGlassEffect) needs the iOS 26 SDK
          XC=""
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV); do
            if DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then XC=$x; break; fi
          done
          if [ -n "$XC" ]; then export DEVELOPER_DIR="$XC/Contents/Developer"; fi
          echo "Xcode: ${XC:-default}, iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -std=c++17 -O2 -Wall \
            -c gpu/angle_ios.cpp -o build/angle_ios.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -O2 -g0 -Wall -fobjc-arc -std=gnu11 \
            -o "$APP/ApkOnIphone" \
            ios/main.m ios/gmptest.c ios/vmprobe.c ios/androidtest.c \
            core/apk.c core/elf.c core/scan.c core/vm.c core/cpu.c core/simd.c \
            core/linux.c core/load.c core/dl.c core/bionic.c core/proc.c core/binder.c core/sf.c core/gralloc.c core/snap.c core/hle.c \
            -DAOI_GPU -Iangle-ios/include gpu/host.c build/angle_ios.o angle-ios/lib/libEGL.a angle-ios/lib/libGLES.a angle-ios/lib/libANGLE.a \
            -framework UIKit -framework Foundation -framework UniformTypeIdentifiers -framework QuartzCore -framework CoreGraphics \
            -framework Metal -framework IOSurface -framework OpenGLES -framework AVFoundation -framework BackgroundTasks -lz -lc++
          cp ios/Info.plist "$APP/Info.plist"
          cp ios/PrivacyInfo.xcprivacy "$APP/PrivacyInfo.xcprivacy"
          cp ios/icons/*.png "$APP/"
          mkdir -p "$APP/licenses" && cp angle-ios/licenses/*.txt LICENSE NOTICE.md "$APP/licenses/"
          cp -RP aroot-mini "$APP/aroot"
          find "$APP/aroot" -type f -exec chmod a-x {} +   # ELF data for the interpreter, not code to sign
          du -sh "$APP/aroot"
          plutil -lint "$APP/Info.plist"
          codesign --force --sign - --timestamp=none "$APP"
          file "$APP/ApkOnIphone"

      - name: Package IPA
        run: |
          cd build
          zip -qry ApkOnIphone.ipa Payload
          ls -la ApkOnIphone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ApkOnIphone-ipa
          path: build/ApkOnIphone.ipa
          if-no-files-found: error

      - name: Release tag
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          V=$(plutil -extract CFBundleShortVersionString raw ios/Info.plist)
          echo "tag=v$V.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ApkOnIphone ${{ steps.ver.outputs.tag }}
          files: build/ApkOnIphone.ipa
          body: |
            LiquidAPK: Android apps on the iPhone. Unsigned IPA, built from ${{ github.sha }}.
            Install with SideStore, AltStore or Sideloadly (they sign it with your Apple ID),
            then see docs/IOS.md. Add an APK ("APK ekle"); it runs in an AArch64 interpreter
            (no JIT, no debugger). Swipe from the left edge for back; hold an app's card for
            its home-screen link.
