# Builds an unsigned .ipa of the iOS test app (ios/). Sideload it with
# SideStore / AltStore / Sideloadly, which sign it with your own Apple ID.
# A push to main also publishes it as a GitHub Release (v<app version>.<run number>).
name: iOS IPA

on:
  push:
    paths: [ "core/**", "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Android's own linker64, bionic, toybox and mksh for the "Android" button
      # (ios/android-files.txt), from the AOSP 14 GSI pinned in tools/fetch-android.sh.
      - name: Cache Android root
        id: aroot
        uses: actions/cache@v4
        with:
          path: aroot-mini
          key: aroot-${{ hashFiles('tools/fetch-android.sh', 'tools/android-root.sh', 'tools/mini-root.sh', 'tools/android-setup.sh', 'tools/mkprops.py', 'tools/uncompress-art.py', 'ios/android-files.txt') }}

      - name: Fetch Android root
        if: steps.aroot.outputs.cache-hit != 'true'
        run: |
          brew install e2fsprogs xz
          export PATH="$(brew --prefix e2fsprogs)/sbin:$PATH"
          sh tools/fetch-android.sh "$RUNNER_TEMP/aroot"
          # what init/apexd do at boot, with Android's own tools run by our interpreter on the runner
          make build/aoiproc
          sh tools/android-setup.sh "$RUNNER_TEMP/aroot" > /dev/null
          sh tools/mini-root.sh "$RUNNER_TEMP/aroot" "$PWD/aroot-mini" ios/android-files.txt
          du -sh aroot-mini
          rm -rf "$RUNNER_TEMP/aroot"

      # Outside the cached step: a restored root must get the current test dex files too.
      - name: Test dex files
        run: |
          mkdir -p aroot-mini/data/local/tmp
          python3 tests/mkdex.py aroot-mini/data/local/tmp/hello.dex
          python3 tests/mkdex.py aroot-mini/data/local/tmp/gc.dex 0 20000

      - name: Build app binary
        run: |
          set -eu
          APP=build/Payload/ApkOnIphone.app
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -O2 -g0 -Wall -fobjc-arc -std=gnu11 \
            -o "$APP/ApkOnIphone" \
            ios/main.m ios/gmptest.c ios/vmprobe.c ios/androidtest.c \
            core/apk.c core/elf.c core/scan.c core/vm.c core/cpu.c core/simd.c \
            core/linux.c core/load.c core/dl.c core/bionic.c core/proc.c core/binder.c core/sf.c \
            -framework UIKit -framework Foundation -framework UniformTypeIdentifiers -framework QuartzCore -lz
          cp ios/Info.plist "$APP/Info.plist"
          cp -RP aroot-mini "$APP/aroot"
          find "$APP/aroot" -type f -exec chmod a-x {} +   # ELF data for the interpreter, not code to sign
          du -sh "$APP/aroot"
          plutil -lint "$APP/Info.plist"
          codesign --force --sign - --timestamp=none "$APP"
          file "$APP/ApkOnIphone"

      - name: Package IPA
        run: |
          cd build
          zip -qry ApkOnIphone.ipa Payload
          ls -la ApkOnIphone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ApkOnIphone-ipa
          path: build/ApkOnIphone.ipa
          if-no-files-found: error

      - name: Release tag
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          V=$(plutil -extract CFBundleShortVersionString raw ios/Info.plist)
          echo "tag=v$V.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ApkOnIphone ${{ steps.ver.outputs.tag }}
          files: build/ApkOnIphone.ipa
          body: |
            Unsigned IPA of the iOS test app, built from ${{ github.sha }}.
            Install with SideStore, AltStore or Sideloadly (they sign it with your Apple ID),
            then see docs/IOS.md. The app runs the real libgmp.so from an APK in the
            interpreter: no JIT, no debugger.
