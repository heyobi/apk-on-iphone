# Accelerator, stage 1: the core built for WebAssembly (Emscripten, wasm32) and run under
# Node with the host's files (NODERAWFS): single-process programs first (busybox applets,
# the accelerator benchmark), to check the core on a 32-bit Wasm host and its speed there.
name: Core on WebAssembly

on:
  push:
    branches: [ linux-userland ]
    paths: [ "core/**", "tools/lxrun.c", "tests/wasm/**", ".github/workflows/wasm.yml" ]
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc gcc > /dev/null
      - name: Build the core for wasm32 (Emscripten)
        run: sh tests/wasm/build.sh
      - name: Alpine minirootfs (official mirror, SHA-256 checked)
        run: sh tests/linux/fetch-alpine.sh "$RUNNER_TEMP/alpine"
      - name: Run single-process programs
        run: sh tests/wasm/run.sh "$RUNNER_TEMP/alpine"
      - name: Debian arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-debian.sh "$RUNNER_TEMP/debian"
      - name: Python 3 into the Debian root (native lxrun, apt)
        run: |
          make build/lxrun > /dev/null
          cp /etc/resolv.conf "$RUNNER_TEMP/debian/etc/resolv.conf"
          LXRUN_QUIET=1 timeout 1500 build/lxrun "$RUNNER_TEMP/debian" /bin/sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 > /dev/null 2>&1; python3 --version'
      - name: Debian programs
        run: sh tests/wasm/run-debian.sh "$RUNNER_TEMP/debian"
      - name: Web build and root file system for the web view
        run: |
          sh tests/wasm/build-web.sh
          tar czf build/web/rootfs.tar.gz -C "$RUNNER_TEMP/alpine" .
          sudo tar czf build/web/rootfs-debian.tar.gz -C "$RUNNER_TEMP/debian" . && sudo chown $USER build/web/rootfs-debian.tar.gz
          ls -la build/web
      - uses: actions/upload-artifact@v4
        with: { name: lxweb, path: build/web, retention-days: 5 }

  webview:
    needs: node
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lxweb, path: tests/wasm/web/Resources }
      - name: Build the LxWeb test app for the simulator
        run: |
          set -o pipefail
          brew install xcodegen
          cd tests/wasm/web && xcodegen generate
          xcodebuild build -project LxWeb.xcodeproj -scheme LxWeb -configuration Release -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1             || { grep -E "error:" build.log | head -n 40; tail -n 30 build.log; exit 1; }
      - name: Run Linux programs in WKWebView (simulator)
        run: |
          cd tests/wasm/web
          UDID=$(bash sim-device.sh "iPhone 17 Pro")
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=$(find build/dd -name LxWeb.app -path '*iphonesimulator*' | head -n 1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.heyobi.lxweb
          D=$(xcrun simctl get_app_container "$UDID" com.heyobi.lxweb data)
          for i in $(seq 1 600); do [ -f "$D/Documents/result.json" ] && break; sleep 2; done
          python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          for k,v in d.items():
              if isinstance(v,dict): print('==',k,'rc',v.get('rc'),'untar',v.get('untar_s'),'s run',v.get('run_s'),'s'); print(v.get('out','').strip()[-700:]); print('   net:', v.get('net','')[:1500]) if v.get('net') else None
              else: print(k,v)
          " "$D/Documents/result.json" || echo "no result"
          xcrun simctl io "$UDID" screenshot shot.png || true
          echo "== second launch: the root from OPFS"
          rm -f "$D/Documents/result.json"
          xcrun simctl terminate "$UDID" com.heyobi.lxweb || true
          sleep 2
          xcrun simctl launch "$UDID" com.heyobi.lxweb
          for i in $(seq 1 300); do [ -f "$D/Documents/result.json" ] && break; sleep 2; done
          cat "$D/Documents/result.json" | head -c 3000 || echo "no second result"
          echo; echo "== terminal transcript ($(cat "$D/Documents/tty-requests.txt" 2>/dev/null) bridge requests)"
          cat -v "$D/Documents/tty.txt" 2>/dev/null | head -c 4000 || echo "no transcript"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lxweb-shot, path: tests/wasm/web/shot.png, retention-days: 5 }
