# LxTerm: the Linux userland demo app (lxios/). The root file systems come from the
# official Alpine and Debian images (checksums verified by tests/linux/fetch-*.sh);
# python3 is installed into each with the distribution's own package manager, run by
# our interpreter (build/lxrun) on an arm64 Linux runner. The app is then built for
# the iOS simulator (run there for screenshots and measurements) and for devices
# (an unsigned IPA to sideload).
name: LxTerm

on:
  push:
    branches: [ linux-userland ]
    paths: [ "core/**", "lxios/**", "tools/lxrun.c", "tests/linux/**", ".github/workflows/lxterm.yml" ]
  workflow_dispatch:

concurrency:
  group: lxterm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Alpine with python3 (apk, in the interpreter)
        run: |
          set -eu
          R=$RUNNER_TEMP/alpine
          sh tests/linux/fetch-alpine.sh "$R"
          cp /etc/resolv.conf "$R/etc/resolv.conf"
          LXRUN_STATS=1 LXRUN_QUIET=1 timeout 900 build/lxrun "$R" /sbin/apk add --no-progress python3
          LXRUN_QUIET=1 build/lxrun "$R" /usr/bin/python3 -c 'import sys; print(sys.version)'
          rm -f "$R/etc/resolv.conf" "$R"/var/cache/apk/*
          tar -czf rootfs-alpine.tar.gz -C "$R" .
          ls -la rootfs-alpine.tar.gz
      - name: Debian with python3 (apt, in the interpreter)
        run: |
          set -eu
          R=$RUNNER_TEMP/debian
          sh tests/linux/fetch-debian.sh "$R"
          rm -f "$R/etc/resolv.conf"; cp /etc/resolv.conf "$R/etc/resolv.conf"
          if LXRUN_STATS=1 LXRUN_QUIET=1 timeout 1500 build/lxrun "$R" /bin/sh -c \
               'apt-get update && apt-get install -y --no-install-recommends python3 && apt-get clean'; then
            LXRUN_QUIET=1 build/lxrun "$R" /usr/bin/python3 -c 'import sys; print(sys.version)'
          else
            echo "::warning::apt install python3 failed in the interpreter; Debian is bundled without it"
          fi
          rm -rf "$R"/var/lib/apt/lists/* "$R/etc/resolv.conf"
          tar -czf rootfs-debian.tar.gz -C "$R" .
          ls -la rootfs-debian.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: rootfs-*.tar.gz
          retention-days: 7

  app:
    needs: rootfs
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
      - name: xterm.js (MIT, from npm; npm checks the registry's integrity hash)
        run: |
          set -eu
          mkdir -p xt && cd xt
          npm pack --silent @xterm/xterm@5.5.0 @xterm/addon-fit@0.10.0
          for t in *.tgz; do mkdir -p "${t%.tgz}" && tar -xzf "$t" -C "${t%.tgz}"; done
          ls
      - name: Build (simulator and device)
        run: |
          set -eu
          XC=""
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV); do
            if DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then XC=$x; break; fi
          done
          if [ -n "$XC" ]; then echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"; export DEVELOPER_DIR="$XC/Contents/Developer"; fi
          SRC="lxios/main.m lxios/untar.c core/elf.c core/scan.c core/vm.c core/cpu.c core/simd.c core/linux.c core/load.c core/dl.c core/bionic.c core/proc.c core/binder.c core/sf.c core/af.c core/gralloc.c core/snap.c core/hle.c core/tty.c"
          for kind in sim dev; do
            if [ $kind = sim ]; then SDK=iphonesimulator; TGT=arm64-apple-ios15.0-simulator; else SDK=iphoneos; TGT=arm64-apple-ios15.0; fi
            APP=build/$kind/Payload/LxTerm.app
            mkdir -p "$APP"
            xcrun --sdk $SDK clang -target $TGT -isysroot "$(xcrun --sdk $SDK --show-sdk-path)" -O2 -g0 -Wall -fobjc-arc -std=gnu11 \
              -o "$APP/LxTerm" $SRC -framework UIKit -framework Foundation -framework WebKit -framework QuartzCore -lz -lresolv
            cp lxios/Info.plist lxios/term.html "$APP/"
            XT=xt/$(ls xt | grep '^xterm-xterm-5' | grep -v tgz); FIT=xt/$(ls xt | grep '^xterm-addon-fit' | grep -v tgz)
            cp $XT/package/lib/xterm.js $XT/package/css/xterm.css $FIT/package/lib/addon-fit.js "$APP/"
            mkdir -p "$APP/licenses"; cp $XT/package/LICENSE "$APP/licenses/xterm.js.txt"; cp LICENSE NOTICE.md "$APP/licenses/"
            cp rootfs-alpine.tar.gz rootfs-debian.tar.gz "$APP/"
            codesign --force --sign - --timestamp=none "$APP"
          done
          (cd build/dev && zip -qry ../LxTerm.ipa Payload)
          ls -la build/LxTerm.ipa
      - name: Run in the simulator
        run: |
          set -eu
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x: ("Pro" not in x["name"], x["name"]))
          print(c[0]["udid"])')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" build/sim/Payload/LxTerm.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.heyobi.lxterm; sleep 6
          xcrun simctl io "$UDID" screenshot shots/0-chooser.png
          xcrun simctl terminate "$UDID" com.heyobi.lxterm || true
          for d in alpine debian; do
            xcrun simctl launch "$UDID" com.heyobi.lxterm -distro $d -measure; sleep 150
            xcrun simctl io "$UDID" screenshot shots/1-$d-session.png
            xcrun simctl terminate "$UDID" com.heyobi.lxterm || true; sleep 2
            xcrun simctl launch "$UDID" com.heyobi.lxterm -distro $d -resume; sleep 12
            xcrun simctl io "$UDID" screenshot shots/2-$d-resumed.png
            xcrun simctl terminate "$UDID" com.heyobi.lxterm || true; sleep 2
          done
          C=$(xcrun simctl get_app_container "$UDID" com.heyobi.lxterm data)
          cp "$C"/Documents/measure-*.txt "$C"/Documents/lxterm-*.log shots/ 2>/dev/null || true
          ls -la "$C/Documents" shots
          cat shots/measure-*.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lxterm-sim
          path: shots
      - uses: actions/upload-artifact@v4
        with:
          name: LxTerm-ipa
          path: build/LxTerm.ipa
