# Linux userland mode: the core runs an ordinary aarch64 Linux root (Alpine, Debian)
# with build/lxrun, on an arm64 Linux runner (the host test path, as build/iostest is
# for Android). Also runs `make test` so the Android path is checked not to regress.
name: Linux userland

on:
  push:
    branches: [ linux-userland ]
    paths: [ "core/**", "tools/lxrun.c", "tests/**", "Makefile", ".github/workflows/linux-userland.yml" ]
  workflow_dispatch:

concurrency:
  group: linux-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Alpine minirootfs (official mirror, SHA-256 checked)
        run: sh tests/linux/fetch-alpine.sh "$RUNNER_TEMP/alpine"
      - name: Alpine checks
        run: sh tests/linux/run_alpine.sh "$RUNNER_TEMP/alpine" net
      - name: Benchmarks (host)
        run: sh tests/linux/bench.sh "$RUNNER_TEMP/alpine"

  debian:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Debian arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-debian.sh "$RUNNER_TEMP/debian"
      - name: Debian checks
        run: sh tests/linux/run_debian.sh "$RUNNER_TEMP/debian" net
      - name: glibc's string functions on the host (core/lxfast.c)
        run: sh tests/linux/run_libcfast.sh "$RUNNER_TEMP/debian"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debian-traces
          path: /tmp/lx-traces
          retention-days: 5

  rpm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: fedora, tag: latest }
          - { image: almalinux, tag: latest }
          - { image: rockylinux/rockylinux, tag: "10" }
          - { image: opensuse/tumbleweed, tag: latest }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: ${{ matrix.image }} arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-image.sh "$RUNNER_TEMP/root" ${{ matrix.tag }} ${{ matrix.image }}
      - name: ${{ matrix.image }} checks
        run: sh tests/linux/run_rpm.sh "$RUNNER_TEMP/root" ${{ matrix.image }} net

  bench-almalinux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: AlmaLinux arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-image.sh "$RUNNER_TEMP/root" latest almalinux
      - name: glibc's string functions on the host (core/lxfast.c)
        run: sh tests/linux/run_libcfast.sh "$RUNNER_TEMP/root"
      - name: dnf's fast start (aoi_proc_zygote)
        run: sudo -E sh tests/linux/run_zygote.sh "$RUNNER_TEMP/root"
      - name: Benchmarks, native and LxTerm engine
        run: sudo -E sh tests/linux/bench_dnf.sh "$RUNNER_TEMP/root" almalinux bench-almalinux.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-almalinux
          path: bench-almalinux.json

  profile-almalinux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc strace > /dev/null
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" > /dev/null || echo "no perf for $(uname -r)"
      - name: Build lxrun
        run: make build/lxrun
      - name: AlmaLinux arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-image.sh "$RUNNER_TEMP/root" latest almalinux
      - name: Where dnf's time goes
        run: sudo -E sh tests/linux/profile_dnf.sh "$RUNNER_TEMP/root" 2>&1 | tee profile-almalinux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: profile-almalinux
          path: profile-almalinux.txt

  apt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Ubuntu arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-image.sh "$RUNNER_TEMP/root" 26.04 ubuntu
      - name: Ubuntu checks
        run: sh tests/linux/run_apt.sh "$RUNNER_TEMP/root" ubuntu

  pacman:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Arch Linux ARM root (its repositories, SHA-256 checked)
        run: python3 tests/linux/fetch-alarm.py "$RUNNER_TEMP/root"
      - name: Arch Linux ARM checks
        run: sh tests/linux/run_pacman.sh "$RUNNER_TEMP/root"

  jupyter:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: Debian arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-debian.sh "$RUNNER_TEMP/debian"
      - name: Jupyter
        run: sh tests/linux/run_jupyter.sh "$RUNNER_TEMP/debian"

  aot-fuzz:                       # the translated libraries against the CPU and the interpreter (tests/aot)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld bc binutils > /dev/null
      - name: Random functions, native = interpreted = translated (a fixed seed and this run's)
        run: |
          sh tests/aot/run.sh 1 300 48 40
          sh tests/aot/run.sh ${{ github.run_number }} 300 48 40

  regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld python3-pip > /dev/null
          pip install --break-system-packages -q unicorn
      - name: make test
        run: make test
      - name: make difftest
        run: make difftest
